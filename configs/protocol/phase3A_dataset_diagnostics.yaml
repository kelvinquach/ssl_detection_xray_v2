    - optimal_confidence_threshold
    - pseudo_label_quality
    - ssl_superiority
    - convergence
    - training_stability

# ---------------------------------------------------------------------
# report_statements - mandatory verbatim statements
# [LOCKED SCIENTIFIC DECISION]
# ---------------------------------------------------------------------
report_statements:
  leakage_statement: >-
    Detailed diagnostics were restricted to the fixed training set and
    legitimately labeled subsets. Validation and test were not used for
    diagnostic threshold selection or methodological tuning. The hidden
    original ground truth of the unlabeled subsets was not used in Phase 3A
    diagnostics.
  threshold_statement_pre_specification: >-
    Primary diagnostic definitions were specified before Phase 3A execution
    and were not selected or modified based on the observed diagnostic
    distributions.
  threshold_statement_sensitivity: >-
    Threshold sensitivity analysis was used only to assess robustness of
    descriptive conclusions and was not used to reselect primary thresholds.
  rare_class_interpretation_statement: >-
    In this report a rare class is a dataset-level low-support operational
    category defined on the fixed training set. It is not a claim that the
    abnormality is clinically rare; no separate clinical evidence is used here.
  bbox_size_interpretation_statement: >-
    Small, Medium and Large are normalized-area-based operational categories
    defined by the locked thresholds 0.01 and 0.10 on normalized bounding-box
    area. They are not the standard COCO pixel-area categories.
  report_sections:
    - "Scope and leakage policy"
    - "Dataset lineage and integrity"
    - "Fixed training-set overview"
    - "Class distribution"
    - "Class-imbalance assessment"
    - "Rare-class analysis"
    - "Bounding-box annotation distribution"
    - "Bounding-box count per image"
    - "Bounding-box geometry"
    - "Normalized-area Small/Medium/Large analysis"
    - "Bounding-box location analysis"
    - "Negative / No Finding analysis"
    - "Labeled-budget diagnostics"
    - "Label-cardinality analysis"
    - "Class co-occurrence"
    - "Threshold sensitivity analysis"
    - "Fixed split structural summary"
    - "Pre-training dataset risks"
    - "Limitations"
    - "Leakage statement"
    - "Conclusions before training"
  method_and_result_must_be_separated: true

# ---------------------------------------------------------------------
# terminology  [LOCKED SCIENTIFIC DECISION]
# ---------------------------------------------------------------------
terminology:
  required:
    bbox_count: "bounding-box annotation count"
    bbox_size: "normalized-area-based bbox size categories"
    rare_class: "low-support class within the fixed training dataset"
  forbidden:
    - "number of unique lesions"
    - "COCO Small"
    - "COCO Medium"
    - "COCO Large"
    - "clinically rare"
