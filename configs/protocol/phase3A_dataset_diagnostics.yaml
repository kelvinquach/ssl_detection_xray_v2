# =====================================================================
# PHASE 3A - DATASET DIAGNOSTICS BEFORE TRAINING
# Repository : ssl_detection_xray_v2
#
# PHASE3A_PROTOCOL = RESEARCHER_APPROVED / LOCKED
#
# This file is the machine-readable protocol consumed by
#   scripts/03A_dataset_diagnostics.py
#   tests/test_phase3A_dataset_diagnostics_guardrails.py
#
# Phase 3A is DESCRIPTIVE PRE-TRAINING DATASET DIAGNOSTICS.
# It is NOT training, NOT evaluation, NOT hyperparameter search,
# NOT pseudo-label generation, NOT an ablation study,
# NOT threshold optimization.
#
# ---------------------------------------------------------------------
# COMMENT CONVENTION (mandated by protocol section 42)
#   [LOCKED SCIENTIFIC DECISION]  - a scientific definition. Changing it
#                                   changes the meaning of the results.
#                                   Must never be altered by an
#                                   implementation concern.
#   [IMPLEMENTATION DETAIL]       - engineering choice, no scientific
#                                   meaning.
#   [VISUALIZATION DETAIL]        - affects rendering only. Must never
#                                   feed back into any threshold, flag,
#                                   category or statistic.
# ---------------------------------------------------------------------
#
# This file MUST NOT contain any Phase 3A result. It contains only
# definitions, locked input identities inherited from Phase 2D/2E/2F,
# and output contracts.
# =====================================================================

# ---------------------------------------------------------------------
# phase
# ---------------------------------------------------------------------
phase:
  id: "3A"                                    # [LOCKED SCIENTIFIC DECISION]
  name: "Dataset Diagnostics Before Training"
  protocol_version: "1.0.0"
  protocol_status: "RESEARCHER_APPROVED_LOCKED"   # [LOCKED SCIENTIFIC DECISION]
  analysis_type: "DESCRIPTIVE_PRE_TRAINING_DATASET_DIAGNOSTICS"
  approval_authority: "RESEARCHER_AND_GPT_REVIEW"
  self_declared_closure_allowed: false
  is_not:
    - model_training
    - model_evaluation
    - hyperparameter_search
    - pseudo_label_generation
    - pseudo_label_filtering_experiment
    - ablation_study
    - test_set_exploration_for_tuning
    - threshold_optimization

# ---------------------------------------------------------------------
# input_artifacts
# All paths are repository-relative POSIX paths and are resolved against
# the repository root (the parent directory of scripts/).
# [IMPLEMENTATION DETAIL] path style; [LOCKED] the artifact identities.
# ---------------------------------------------------------------------
input_artifacts:
  canonical:
    coco_master: "data/processed/coco/coco_master.json"
    coco_master_jpg: "data/processed/coco/coco_master_jpg.json"
  fixed_split:
    train: "data/processed/coco/instances_train.json"
    val: "data/processed/coco/instances_val.json"
    test: "data/processed/coco/instances_test.json"
    split_lock_manifest: "data/manifests/split_lock_manifest.json"
  labeled_subsets:
    "1pct": "data/processed/coco/labeled_splits/instances_labeled_1pct.json"
    "5pct": "data/processed/coco/labeled_splits/instances_labeled_5pct.json"
    "10pct": "data/processed/coco/labeled_splits/instances_labeled_10pct.json"
    "20pct": "data/processed/coco/labeled_splits/instances_labeled_20pct.json"
  phase2F_evidence:
    protocol: "configs/protocol/phase2F_labeled_unlabeled.yaml"
    lock_manifest: "data/manifests/phase2F_lock_manifest.json"
    nested_split_check: "data/manifests/phase2F_nested_split_check.json"
    leakage_check: "data/manifests/phase2F_leakage_check.json"
    class_distribution_csv: "reports/02F_class_distribution.csv"
    negative_distribution_csv: "reports/02F_negative_distribution.csv"
    validation_report: "reports/02F_labeled_unlabeled_validation_report.json"
    deterministic_reconstruction_check: "reports/02F_deterministic_reconstruction_check.json"
  phase2F1_seed_evidence:
    protocol: "configs/protocol/phase2F1_seed_protocol.yaml"
    seed_manifest: "data/manifests/seed_manifest.json"
    seed_state_manifest: "data/manifests/seed_state_manifest.json"
  # No unlabeled-subset COCO file is listed anywhere in this protocol,
  # by design. See scope_policy.unlabeled_hidden_gt.
  unlabeled_subsets: {}

# ---------------------------------------------------------------------
# expected_hashes  [LOCKED SCIENTIFIC DECISION - input identity]
# SHA-256 of the exact bytes of each locked input JSON.
# A null value means the protocol does not lock that artifact's hash;
# the observed hash is then recorded as evidence only and never gates.
# ---------------------------------------------------------------------
expected_hashes:
