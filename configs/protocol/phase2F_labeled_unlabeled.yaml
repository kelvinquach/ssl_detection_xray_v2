#
# Revision: R3 (second GPT static review — REVISION REQUIRED, applied).
# Changes from R2:
#   - iterative-stratification is version-locked to exactly 0.1.9, checked
#     at runtime via importlib.metadata (never __version__/pkg_resources),
#     fail-closed on mismatch/absence; version recorded in the validation
