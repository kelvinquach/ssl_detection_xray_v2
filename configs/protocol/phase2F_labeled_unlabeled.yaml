unlabeled_json_forbidden_fields:
  images:
    - is_negative
    - scope_label
    - zero_gt
    - class_presence
    - class_presence_vector
    - annotation_count
    - bbox
    - bbox_count
  note: >-
    instances_train.json image records carry `is_negative` and
    `scope_label`, which are 100%-correlated with zero-GT status and are
    therefore GT-derived. These fields (and any other GT-derived field) must
    be stripped from every image record written into an unlabeled COCO JSON.
  unlabeled_annotations_must_equal: []
  unlabeled_categories_must_be_preserved: true

required_evidence_fields:
  top_level:
    - iterative_stratification_version
    - active_repair_policy
    - objective_repair_neighborhood
    - objective_repair_termination_claim
    - global_optimum_claimed
  per_budget:
    - D_max
    - D_mean
    - D_LC
    - E_max
    - E_mean
    - E_LC
    - train_reference_prevalence_per_class
    - labeled_prevalence_per_class
    - absolute_deviation_per_class
    - worst_deviation_class
    # R11: the ambiguous one_for_one_move_count / two_for_two_move_count
    # pair is REPLACED by an unambiguous per-phase and per-type breakdown.
    # The old one_for_one_move_count silently merged exact-size add/remove
    # toggles with exact-No-Finding, coverage and objective-repair swaps,
    # which made a recorded count impossible to attribute to a phase after
    # the fact.
    - move_count_by_phase
    - move_count_by_type
    - unique_ids_added
    - unique_ids_removed
    - repair_fraction
    - candidate_final_intersection_count
    - candidate_final_jaccard
    - objective_before_repair
    - objective_after_repair
    - neighborhood_exhaustion_status
    - final_one_for_one_diagnostics
    - nested_no_finding_check

# R11 / TASK 5 -- the evidence record written for EVERY budget at the final
# one-for-one local optimum (validation report per-budget
# `final_one_for_one_diagnostics`, and the same record in the non-promoting
# operational-benchmark report). Every value is produced by an EXISTING
