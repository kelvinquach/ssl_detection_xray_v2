#     |pool|^2), infeasible at real scale): addressed with an exact
#     equivalence-class signature search
#     (_equivalence_class_two_for_two_search), mathematically PROVEN
#     equivalent to exhaustive concrete enumeration on every tier of the
#     locked acceptance ordering. Worst-case complexity is not proven
#     better than brute force, so the engine is gated behind
#     `two_for_two_engine.operationally_approved` (a locked, false-by-
#     default researcher/GPT decision field); construction refuses closed
#     with taxonomy TWO_FOR_TWO_ENGINE_NOT_OPERATIONALLY_APPROVED before
