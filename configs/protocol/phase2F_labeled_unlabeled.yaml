#     first pipeline (_safe_validate_staged_coco_structure /
#     _safe_rebuild_staged_indicators) -- structural prerequisites are
#     checked with functions that NEVER raise, and build_indicators()-
#     equivalent semantic reconstruction is only attempted after they pass;
#   - R4-B2 (Phase 2 complexity was mis-described as
#     O(max equivalence-class size^2)): corrected everywhere (this file,
#     script comments, preflight/report fields) to the precise formula
#     Phase 1 = O(R*A), Phase 2 = O(sum over tied-best transitions w of
#     C_out(w)*C_in(w)), Total = O(R*A + that sum), worst case still
#     O(S^2*P^2). mathematical_completeness, empirical_operational_
#     tractability, and operational_approval are now three explicitly
#     distinct, separately labeled concepts (see two_for_two_engine below);
#   - R4-B3 (the engine never checked a deadline internally, only the
#     caller checked once before invoking it): fixed -- the engine now takes
#     a `deadline` parameter and checks it inside both Phase 1 and Phase 2
#     enumeration via a named watchdog check-interval constant (a resource-
#     cutoff check FREQUENCY only, never a candidate cap, never altering
#     results when deadline=None);
#   - R4-B4 (Phase 1 stored every accepted signature transition in a list
#     then sorted it, O(R*A) memory): fixed with a streaming best-prefix
#     search (best_prefix / tied_best_transitions), O(|W|) auxiliary memory;
#   - R4-B5 (preflight diagnostics -- 3 fields -- were insufficient for an
#     operational-approval decision): expanded with full-train distribution
#     diagnostics (min/max/mean/median/histogram of equivalence-class sizes,
#     possible pair-signature counts, theoretical concrete-pair/Phase-1
#     transition upper bounds, all with explicit non-representativeness/
#     non-auto-approval/no-seed-selection caveats) and a new per-invocation
