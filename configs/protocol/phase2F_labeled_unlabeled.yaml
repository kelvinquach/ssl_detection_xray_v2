objective:
  # Distribution objective indicators: the 14 abnormal class-presence
  # indicators ONLY. zero_gt is a separate hard constraint (exact No-Finding
  # count) and a separate stratification-matrix column; it must never enter
  # D_max, D_mean, E_max, or E_mean.
  distribution_indicators: 14
  stratification_indicators: 15   # 14 class-presence + 1 zero_gt, sampling matrix only
  zero_gt_role: stratification_and_exact_no_finding_hard_constraint_only
  lexicographic_order: [D_max, D_mean, D_LC]
  d_max_definition: "max over the 14 abnormal classes of abs(p_L,c - p_T,c)"
  d_mean_definition: "mean ABSOLUTE per-class prevalence deviation = (1/14) * sum_c abs(p_L,c - p_T,c). NOT squared."
  d_lc_definition: "abs(mean label cardinality in Lb (14 abnormal classes) - mean label cardinality in train)"
  cumulative: true   # objective is evaluated over the whole nested L_b, not the increment alone

  selection_arithmetic: exact_integer
  selection_arithmetic_note: >-
    Move selection/ranking in the repair search path uses an EXACT INTEGER
    tuple (E_max, E_mean, E_LC), never a Fraction or float, and never
    round()/math.isclose()/np.isclose(). fractions.Fraction is permitted
    ONLY for post-hoc reporting (D_max/D_mean/D_LC in the validation report
    and CSVs) and as the reference oracle in unit tests, never inside the
    move-acceptance comparison itself.
  integer_objective_definition: >-
    Let n = |L_b| (current candidate size), N = |Train| (3426, fixed), k_c =
    class-c presence count within the current candidate (14 classes), K_c =
    class-c presence count within the full Train set, S_L = sum_c k_c, S_T =
    sum_c K_c. Then:
      E_max  = max_c abs(k_c*N - K_c*n)
      E_mean = sum_c abs(k_c*N - K_c*n)
      E_LC   = abs(S_L*N - S_T*n)
    These are exact cross-multiplied integer forms of D_max, D_mean*14, D_LC
    respectively (same shared positive scale factor n*N within any single
    move comparison, since n is constant across all alternatives compared in
    one search step), so integer comparison preserves the same total order
    as the exact-fraction objective without ever performing division.

tie_break:
  # Three canonical, versioned, namespaced SHA-256 priority functions.
  # Namespaces are frozen version strings; changing the payload format
  # requires a new version suffix (v2, v3, ...), never silently redefining
  # v1.
  namespaces:
    image_priority: phase2F_image_priority_v1
    repair_move_priority: phase2F_repair_move_priority_v1
    candidate_set_priority: phase2F_candidate_set_priority_v1
  sha256_priority_seed: 42
  image_priority_payload: "{namespace}|seed={seed}|image_id={image_id}"
  image_priority_use: >-
    Per-image deterministic priority, order-independent by construction
    (pure function of seed and a single image_id). Exposed and tested for
    determinism/order-independence; used wherever a single-image identity
    (not a multi-image move) needs a canonical priority value.
  repair_move_priority_payload: >-
    "{namespace}|seed={seed}|budget={budget}|phase={repair_phase}|
    move_type={move_type}|removed={canonical_sorted_removed_ids_csv}|
    added={canonical_sorted_added_ids_csv}"
  repair_move_priority_use: >-
    The primary move-selection tie-break for every repair phase (exact_size
    treats a single toggle as removed=[] or added=[] with the other side
    holding the one image_id; exact_no_finding, minimum_class_coverage, and
    objective_repair use the full removed/added ID lists of the swap). The
    ENTIRE move identity is hashed once as a single payload — never a
    combination of separate per-image hashes.
  candidate_set_priority_payload: "{namespace}|seed={seed}|budget={budget}|members={canonical_sorted_member_ids_csv}"
  candidate_set_priority_use: >-
    A canonical whole-candidate-set fingerprint recorded alongside the
    membership SHA-256 in every accepted repair-log entry, distinct from
    the official NHIEM VU 5 membership checksum; provides a second,
    independently-namespaced identity for deterministic-rerun comparison.
  final_fallback: canonical_numeric_move_identity
  final_fallback_definition: >-
    If two candidate moves ever produce an identical priority digest (not
    expected in practice, but must be handled), the tie-break falls back to
    comparing (tuple(sorted(removed_ids)), tuple(sorted(added_ids))) as
    plain integer tuples.
  note: >-
    Tie-break is used only to choose deterministically among moves that tie
    on the exact same lexicographic integer objective tuple AND make the
    same required hard-constraint (or, in objective_repair, strict
    objective-improvement) progress. A move with a strictly better integer
    objective always wins over tie-break priority; tie-break priority never
    overrides a better objective.

repair:
  # R11 -- the single locked name of the ACTIVE repair policy. Cross-checked
  # against scripts/02F_build_labeled_unlabeled.py's ACTIVE_REPAIR_POLICY
  # constant in run_preflight (a PASS/FAIL check, not an informational
  # field) AND enforced fail-closed in compute_all_budgets before any
  # construction begins (taxonomy ACTIVE_REPAIR_POLICY_MISMATCH), so this
  # document and the implementation can never silently disagree about which
  # neighborhood is actually searched.
  active_repair_policy: ONE_FOR_ONE_EXHAUSTIVE_DETERMINISTIC
  active_repair_policy_note: >-
    The objective-repair stage exhaustively enumerates the admissible
    one-for-one swap neighborhood and terminates at a one-for-one local
    optimum. No global optimum is claimed. This replaces the retired
    two_for_two_engine.operationally_approved gate as the pre-construction
    fail-closed check; that gate was NOT flipped to true, it was removed
    together with the neighborhood it guarded.
  phase_order: [exact_size, exact_no_finding, minimum_class_coverage, objective_repair]
  phase_descriptions:
    exact_size: "single-image add/remove moves until |L_b(new region)| equals the round-half-up target"
    exact_no_finding: "one-for-one swaps (opposite zero_gt status) until the exact No-Finding target is met; size held fixed"
    minimum_class_coverage: "deterministic ONE-FOR-ONE swaps only, until all 14 classes are present; size, exact NF and the locked nested prefix held fixed; if the complete admissible one-for-one coverage neighborhood is exhausted while classes remain missing, the phase reports REPAIR_INFEASIBLE and construction stops, naming the exact failing budget and phase -- it never widens the neighborhood and never retries with another seed"
    objective_repair: "deterministic ONE-FOR-ONE local-search improvement pass after exact size/NF/coverage are satisfied; the complete admissible one-for-one neighborhood is enumerated every iteration and only strictly lexicographically-improving moves are accepted; size, exact NF, 14/14 coverage and the locked nested prefix are held fixed throughout; terminates at a one-for-one local optimum (RepairOutcome.OK)"
  exact_no_finding_move_order: [one_for_one]
  exact_no_finding_note: >-
    exact_no_finding is inherently a composition-CHANGING swap (its entire
    purpose is to shift the NF count by one). The two-for-two
    composition-PRESERVING neighborhood defined below is only meaningful for
    phases that must hold NF composition fixed (minimum_class_coverage,
    objective_repair). No two-for-two fallback is defined for
    exact_no_finding; if no one-for-one swap makes progress, the phase
    reports REPAIR_INFEASIBLE, matching the precedent in Phase 2E's own
    exact_no_finding_swap_repair (which is also one-for-one only).
  # R11: the ACTIVE move order for BOTH minimum_class_coverage and
  # objective_repair is one-for-one and nothing else. There is no second
  # neighborhood to fall through to, and no heuristic replaced the removed
  # two-for-two branch.
  move_order_for_coverage_and_objective_repair: [one_for_one]
  coverage_progress_rule: STRICTLY_REDUCE_MISSING_CLASS_COUNT_BY_AT_LEAST_ONE
  coverage_progress_rule_note: >-
    Locked constant name, cross-checked against
    scripts/02F_build_labeled_unlabeled.py's COVERAGE_PROGRESS_RULE in
    run_preflight so the protocol document and the implementation cannot
    silently diverge on the semantics of "progress" for
    minimum_class_coverage.
  coverage_candidate_priority_order:
    - missing_count_after
    - integer_objective_tuple
    - seeded_sha256_priority
    - canonical_numeric_identity
  coverage_candidate_priority_order_note: >-
    For minimum_class_coverage ONLY (not objective_repair, which has no
    missing-class concept once coverage is satisfied): among all candidate
    moves that satisfy STRICTLY_REDUCE_MISSING_CLASS_COUNT_BY_AT_LEAST_ONE,
    the one with the SMALLEST missing_count_after (i.e. the most coverage
    progress) always wins first, ahead of a better integer objective tuple.
    Only when missing_count_after ties does the integer objective tuple
    decide, then the seeded namespaced SHA-256 move priority, then the
    canonical numeric move identity as the final deterministic fallback.
  # R11: the two-for-two neighborhood is NOT part of the active protocol.
  # Its former specification (two_for_two_neighborhood,
  # two_for_two_complexity_status, two_for_two_complexity_note) has been
  # moved verbatim-in-spirit under legacy_two_for_two_engine below and is
  # marked HISTORICAL there. No active repair phase enumerates it.
  active_objective_neighborhood: one_for_one_swap_exhaustive
  active_objective_neighborhood_definition: >-
    Every ordered pair (out_position in the current selected set,
    in_position in the addable complement new_region_pool - selected) whose
    zero_gt status matches, whose resulting membership preserves the exact
    labeled size, the exact No-Finding count and 14/14 class coverage, and
    which has not already been visited by the membership cycle guard. Every
    such pair is evaluated on every iteration -- there is no top-k, no
    sampling, no early cut-off, no candidate cap and no heuristic pruning.
  active_objective_termination: one_for_one_local_optimum
  active_objective_termination_note: >-
    The phase terminates when the complete admissible one-for-one
    neighborhood contains no strictly-improving move. That state is a
    ONE-FOR-ONE LOCAL OPTIMUM and is reported as a SUCCESS
    (RepairOutcome.OK) with one_for_one_exhausted=true, local_optimum=true,
    local_optimum_neighborhood="one_for_one" and
    global_optimum_claimed=false. It is never reported as
    COMPUTATIONAL_ABORT, never as REPAIR_INFEASIBLE, and never as a global
    optimum.
  global_optimum_claimed: false
  arbitrary_k_swap_ge_3: forbidden
  immutable_nested_prefix: true
  immutable_prefix_note: >-
    Repair moves for budget b may only add/remove/swap images within the
    new-region pool (train universe minus the already-locked L_{prev}
    prefix). Images already committed to a smaller nested budget are never
    touched again.
  strict_monotonic_progress: true
  strict_monotonic_progress_note: >-
    exact_size/exact_no_finding/minimum_class_coverage: each accepted move
    must reduce the phase's own hard-constraint gap (size gap, No-Finding
    gap, or missing-class count) by exactly one unit. objective_repair: each
    accepted move must strictly lexicographically improve the integer
    objective tuple (E_max, E_mean, E_LC); an equal-objective move is never
    accepted in this phase.
  equal_objective_move_forbidden: true
  equal_objective_move_forbidden_scope: objective_repair_phase
  objective_repair_termination: >-
    Enumerate the COMPLETE admissible one-for-one neighborhood; accept the
    single best strictly-improving move; repeat. The phase terminates
    (status OK, not an error) when that neighborhood is exhausted with no
    strictly-improving move remaining. The reported result is an
    explicitly-labeled ONE-FOR-ONE LOCAL OPTIMUM, never claimed as a global
    optimum. There is no second neighborhood to fall through to.
  visited_membership_cycle_guard: true
  # R11: scoped explicitly to the ACTIVE one-for-one neighborhood. This says
  # the one-for-one neighborhood is enumerated in full with no top-k and no
  # heuristic filter; it does NOT claim anything about any wider
  # neighborhood.
  neighborhood_exhaustion: full_no_topk_heuristic_over_one_for_one_neighborhood
  move_count_cap: none
  on_exhausted_no_solution: REPAIR_INFEASIBLE
  on_resource_cutoff: COMPUTATIONAL_ABORT
  computational_abort_seconds_default: null   # null = no time-based cutoff unless researcher passes --max-seconds

# ===================== LEGACY / NON-ACTIVE (R11) ========================== #
# HISTORICAL RECORD ONLY. This block describes the two-for-two
# same-composition engine, which R11 REMOVED from the active construction
# protocol. Every claim in this block -- "exhaustive two-for-two search",
# "two-for-two local optimum", "mathematical completeness over the
# two-for-two neighborhood", and the operational-tractability approval
# concept -- is HISTORICAL and is NOT an active protocol claim.
#
# It is retained so the R7/R8/R9 historical benchmark reports remain
# interpretable and so the retained legacy unit tests keep a documented
# reference. It is NOT read by any active code path:
#   - run_preflight no longer reads it and no longer reports any of its
#     fields (its former informational fields were removed);
#   - compute_all_budgets no longer gates on operationally_approved -- that
#     gate was REMOVED, not set to true, and replaced by the fail-closed
#     repair.active_repair_policy check;
#   - build_budget_step never reaches _equivalence_class_two_for_two_search
#     on any call path (official materialization, --reconstruct-check, or
#     the non-promoting operational benchmark).
# operationally_approved is deliberately left at false: it must never be
# read as "the engine was approved", only as "the engine was never
# approved, and then the question stopped applying".
legacy_two_for_two_engine:
  status: HISTORICAL_NOT_PART_OF_ACTIVE_PROTOCOL
  removed_in: "2F-C0-R11"
  removed_reason: COMPUTATIONAL_TRACTABILITY_AND_PROPORTIONALITY
  removed_before_training: true
  removed_without_val_or_test_outcomes: true
  removed_without_model_performance: true
  removed_without_candidate_comparison: true
  removed_without_seed_search: true
  active_protocol_depends_on_this_block: false
  gates_materialization: false
  same_composition_algorithm: equivalence_class_signature_search_streaming_best_prefix
  operationally_approved: false
  operationally_approved_note: >-
    HISTORICAL R5--R9 field only. In those retired revisions, false caused
    compute_all_budgets() to refuse construction with taxonomy
    TWO_FOR_TWO_ENGINE_NOT_OPERATIONALLY_APPROVED. That behavior no longer
    applies in R11: active construction never reads this field, never calls
    the legacy engine and is gated instead by repair.active_repair_policy.
    The value remains false solely to record that the engine was never
    approved before it was removed from the active protocol.

  # R5 / NHIEM VU 2 -- three DELIBERATELY DISTINCT concepts, each its own
  # field, never conflated:
  #   1. mathematical_completeness  -- proven UNCONDITIONALLY, independent
  #      of the actual dataset (see completeness_claim below);
  #   2. empirical_operational_tractability -- data-dependent, NOT proven,
  #      NOT measured by Claude in this revision (see
  #      operational_tractability_claim below);
  #   3. operational_approval -- a separate, human-owned decision gate
  #      (the operationally_approved field above), which may be granted or
  #      withheld independent of (1) and (2) being favorable.
  # HISTORICAL (R11): the three fields below were the R5 concept separation.
  # None of them is an active claim any more. `completeness_claim` in
  # particular is NOT asserted by the active protocol -- the only
  # completeness the active protocol claims is over the one-for-one
  # neighborhood (see repair.active_objective_neighborhood).
  historical_completeness_claim: MATHEMATICALLY_PROVEN_EQUIVALENT_TO_EXHAUSTIVE_CONCRETE_SEARCH_ON_LOCKED_ACCEPTANCE_ORDERING
  completeness_claim_note: >-
    This is the mathematical_completeness concept. Proven equivalent to
    _brute_force_same_composition_two_for_two_pairs (kept as a test-only
    oracle, never called against real data) on all four tiers of the
    locked candidate order: hard-constraint feasibility/progress, exact
    integer objective, seeded SHA-256 move priority, and canonical numeric
    identity. Holds UNCONDITIONALLY (true for any dataset), including after
    the R5 streaming-best-prefix rewrite of Phase 1 (streaming an
    already-total order via reset-on-strictly-better/append-on-tie/discard-
    on-worse produces an identical winning set to sort-then-group; see the
    PROOF 2 comment and the R5 STREAMING PROOF comment above
    _equivalence_class_two_for_two_search in
    scripts/02F_build_labeled_unlabeled.py).
  historical_operational_tractability_claim: NOT_EMPIRICALLY_MEASURED_BY_CLAUDE_DATA_DEPENDENT_NOT_ASSUMED_FROM_COMPLETENESS_PROOF
  operational_tractability_claim_note: >-
    This is the empirical_operational_tractability concept, and it is
    DELIBERATELY NOT the same claim as completeness_claim above:
    mathematical correctness/completeness holds regardless of the dataset,
    but whether the engine finishes in practical wall-clock time on the
    real 3,426-image instances_train.json depends on that dataset's actual
    equivalence-class-size distribution, which Claude has not inspected
    (barred from running code against real data in this revision). See
    complexity_policy below for the precise (now corrected) asymptotic
    formula, and full_train_diagnostics_fields for what the researcher can
    inspect via --preflight-only to inform their own tractability judgment.
  historical_complexity_policy: >-
    CORRECTED (R5 / fixes blocker R4-B2). Let R = number of valid
    removed-pair signatures, A = number of valid added-pair signatures (both
    counted once per signature-pair, not per concrete image-pair), W = the
    set of signature transitions tied for the best Phase-1 prefix (hard-
    constraint/objective tuple), and for each w in W let C_out(w) = number
    of concrete removed image-pairs realizing w's removed-signature-pair and
    C_in(w) = number of concrete added image-pairs realizing w's added-
    signature-pair (C_out/C_in for a same-signature pair {c,c} is
    C(|class c|,2); for a different-signature pair {c1,c2} it is
    |class c1| * |class c2|). Then: Phase 1 time = O(R*A) (O(1) per
    signature-pair via an incrementally-updated aggregate, no re-summing
    labels14); Phase 2 time = O(sum_{w in W} C_out(w) * C_in(w)) -- bounded
    by the TIED-BEST transitions only, never by all R*A of them; Total time
    = O(R*A + sum_{w in W} C_out(w)*C_in(w)). After the R5 streaming
    best-prefix rewrite, Phase 1 auxiliary memory is O(|W|), not O(R*A) (no
    full candidate list is ever materialized or sorted). In the fully
    label-vector-distinct adversarial case (every abnormal image a unique
    14-bit vector), R=O(S^2), A=O(P^2), so Phase 1 degrades to the SAME
    O(S^2*P^2) order as brute force -- NO WORST-CASE IMPROVEMENT IS PROVEN,
    though in that exact adversarial case every equivalence class has
    exactly one member, so every C_out(w)/C_in(w)=1 and Phase 2 is trivial.
    Practical/expected performance on real VinDr-CXR/VinBigData
    label-vector distributions (14 fixed classes, typically 1-3
    co-occurring findings per abnormal image) is plausibly, but NOT
    empirically verified by Claude, far better than worst case -- this
    plausibility is the operational_tractability_claim above, kept
    separate from this formula and from mathematical_completeness. This is
    exactly why operationally_approved is a separate, human-owned gate
    rather than an automatic consequence of implementing a
    mathematically-correct engine, and practical tractability must NEVER be
    inferred from the correctness proof alone.
  deadline_watchdog_check_interval_candidates: 1024
  deadline_watchdog_note: >-
    R5 / fixes blocker R4-B3. _equivalence_class_two_for_two_search now
    accepts a `deadline` parameter (propagated from
    repair_min_class_coverage and repair_objective_local_search, both of
    which already receive one from build_budget_step/compute_all_budgets)
    and checks it inside BOTH Phase 1 (signature-pair enumeration) and
    Phase 2 (concrete Cartesian-product enumeration), not just once by the
    caller before invoking the engine. To bound the per-check overhead, the
    deadline is polled at most once every
    deadline_watchdog_check_interval_candidates enumerated candidates (a
    named, deterministic constant) rather than before every single
    candidate. This interval is PURELY a resource-cutoff check FREQUENCY:
    it never skips, drops, or reorders a candidate, never depends on the
    data, and never changes the returned result when deadline=None (in
    which case _check_deadline is a no-op regardless of how often it is
    called). On expiry, DeadlineExceeded propagates out of the engine and
    is caught only by build_budget_step, which reports
    RepairOutcome.COMPUTATIONAL_ABORT with two_for_two_exhausted=false and
    local_optimum=false (never REPAIR_INFEASIBLE, never a false exhaustion/
    local-optimum claim) and discards the in-progress candidate membership
    (locked | initial_new is returned as an ABORTED, non-repaired state,
    never treated by any downstream code as a valid repaired result to
    promote or report as a scientific outcome). R6 / fixes blocker R5-B3:
    on top of the in-loop watchdog above, `_check_deadline` is ALSO called
    once at function entry and once immediately before each of the three
    normal return paths (trivial early-exit, exhausted, completed) as
    BOUNDARY checks -- so a neighborhood with fewer candidates than
    deadline_watchdog_check_interval_candidates, or a deadline that expires
    in the narrow gap after the last enumerated candidate but before the
    function actually returns, is still caught. These boundary checks are
    not a candidate cap either; deadline=None makes all of them no-ops.
  fail_closed_taxonomy: TWO_FOR_TWO_ENGINE_NOT_OPERATIONALLY_APPROVED
  fail_closed_note: >-
    HISTORICAL R5--R9 behavior: compute_all_budgets() refused construction
    whenever operationally_approved was false. R11 does not execute this
    taxonomy, does not expose the legacy benchmark/profiler modes and does
    not report legacy engine fields in active preflight output.

  # R5 / NHIEM VU 5 -- expanded diagnostics contract (fixes blocker R4-B5).
  full_train_diagnostics_fields:
    - total_abnormal_images_in_train
    - distinct_label_vector_count
    - equivalence_class_size_min
    - equivalence_class_size_max
    - equivalence_class_size_mean
    - equivalence_class_size_median
    - equivalence_class_size_histogram
    - possible_pair_signature_count
    - theoretical_concrete_pair_count_upper_bound
    - phase1_transition_count_upper_bound
  full_train_diagnostics_caveats: >-
    Computed ONCE over the FULL instances_train.json abnormal-image
    population. This is explicitly NOT representative of any single
    budget's actual incremental selected/pool subset during a real run
    (those are strict subsets, typically far smaller, and their
    equivalence-class structure can differ from the full-train structure).
    These diagnostics alone are NOT sufficient to auto-approve the engine
    -- operationally_approved remains a separate human decision regardless
    of how favorable these numbers look. These diagnostics must NEVER be
    used to choose, tune, or search over partition_seed or any other
    randomness -- seed_search_forbidden applies unconditionally regardless
    of what these numbers show.
  runtime_diagnostics_fields:
    - budget
    - repair_phase
    - status
    - aborted_by_deadline
    - deadline_enabled
    - selected_abnormal_count
    - pool_abnormal_count
    - selected_distinct_signature_count
    - pool_distinct_signature_count
    - removed_pair_signature_count_R
    - added_pair_signature_count_A
    - phase1_transition_count
    - phase1_transitions_evaluated
    - tied_best_signature_transition_count_W
    - concrete_candidates_evaluated_phase2
    - theoretical_concrete_candidates_in_winning_ties
    - elapsed_seconds
  runtime_diagnostics_note: >-
    One such record per actual _equivalence_class_two_for_two_search
    invocation (i.e. per budget, per repair phase that reaches the
    two-for-two branch), recorded into repair-log/validation-report
    evidence ONLY once the engine is operationally_approved and a real run
    actually executes it -- never fabricated or backfilled while
    unapproved. The record is appended to the diagnostics log BEFORE the
    engine is invoked (status="started" initially) and the engine mutates
    the SAME object in place, so a record survives even if the invocation
    raises DeadlineExceeded (R6 / fixes blocker R5-B2) -- "started" is only
    ever a transient in-flight value and must never appear in final
    evidence after the invocation has actually finished (successfully or
    by abort). `status` is one of completed (a candidate move was found and
    returned) / exhausted (the allowed neighborhood was fully searched with
    no candidate) / aborted (a deadline/resource cutoff fired before either
    of the above; aborted_by_deadline=true, and the run must never also
    claim exhausted-with-no-solution or a local optimum). Field-level
    nullable-on-early-abort semantics: `elapsed_seconds`, `phase1_
    transitions_evaluated`, `concrete_candidates_evaluated_phase2`,
    `deadline_enabled`, and `status`/`aborted_by_deadline` are ALWAYS
    populated (pure functions of a clock/counter that exist from the first
    line of the call); every other field (selected/pool_abnormal_count,
    selected/pool_distinct_signature_count, removed/added_pair_signature_
    count_R/A, phase1_transition_count, tied_best_signature_transition_
    count_W, theoretical_concrete_candidates_in_winning_ties) is `null`,
    NOT `0`, if the invocation aborted before that specific quantity was
    ever actually computed -- a recorded `0` always means "measured and
    found to be exactly zero", never "not yet measured". These diagnostics
    are purely descriptive: they must never be used to change candidate
    membership, the accepted move, or any selection decision.

checksum:
  image_id_membership:
    validate_integer: true
    sort: numeric_ascending
    representation: canonical_decimal
    join: LF
    encoding: UTF-8
    algorithm: SHA-256

# R11 additive runtime observability. These fields are written to the
# validation report and lock manifest, but are never membership identity,
# checksum, seed, objective, acceptance, or reconstruction-comparison inputs.
runtime_timing:
  clock: "time.monotonic"
  role: "OBSERVABILITY_ONLY_NOT_SELECTION_CRITERION"
  per_budget_field: per_budget_elapsed_seconds
  total_field: total_construction_elapsed_seconds
  included_in_membership_checksum: false
  included_in_reconstruct_comparison: false

deterministic_reconstruction_mode:
  cli_flag: --reconstruct-check
  writes_official_artifacts: false
  subject_to_refuse_overwrite_gate: false
  compares_against: data/manifests/phase2F_lock_manifest.json (already promoted)
  compared_fields:
    - labeled_image_id_sha256
    - labeled_coco_json_sha256
    - unlabeled_coco_json_sha256
    - labeled_size
    - no_finding_size
    - repair_move_counts
    - integer_objective_final
  compared_fields_note: >-
    Every field listed here MUST have a corresponding implemented check in
    run_reconstruct_check()'s RECONSTRUCTION_COMPARABLE_FIELDS; the field
    list is read from THIS config at runtime and iterated over (never a
    Python-hardcoded literal), and any listed field without an implemented
    check is a hard FAIL (CONFIG_INVALID), never a silent skip. Both
    labeled AND unlabeled coco_json_sha256 are compared separately (R2 only
    declared a single ambiguous "coco_json_sha256" and never actually
    compared it at all).
  output_path: reports/02F_deterministic_reconstruction_check.json
  output_path_note: >-
    This diagnostic path is intentionally excluded from
    official_relative_paths()/the transactional promotion set — it is
    freely re-runnable and overwritable, and never gates or blocks the
    official materialization it is checking.

# R7 -- NON-PROMOTING operational benchmark of the two-for-two repair
# engine on the real training split. Distinct from
# deterministic_reconstruction_mode above: reconstruct-check still
# requires operationally_approved=true (it calls compute_all_budgets
# unchanged) and compares against an EXISTING promoted lock manifest;
# operational_benchmark requires NO prior promotion, is the one and only
# path allowed to run construction while operationally_approved=false, and
# exists specifically to produce the tractability EVIDENCE the researcher
# needs before deciding operationally_approved.
operational_benchmark:
  cli_flag: --benchmark-two-for-two
  cli_deadline_flag: --benchmark-max-seconds-per-budget
  mode_name: NON_PROMOTING_OPERATIONAL_BENCHMARK
  # R9: this is a NEW, distinct path from BOTH the R7 canonical report and
  # the R8 report below -- the R8 file ran against the pre-R9 (structurally
  # redundant but scientifically correct) Phase-1 implementation, so it is
  # superseded FOR APPROVAL-EVIDENCE PURPOSES ONLY, exactly like R7 before
  # it. It is never characterized as invalid, is NEVER deleted or
  # overwritten by any code path, and remains valid historical evidence of
  # the R8 run. Any future revision that changes performance-relevant
  # implementation or scientific semantics again must bump this path to yet
  # another distinct name -- never reuse an old stage's report path.
  report_path: reports/02F_two_for_two_operational_benchmark_R9.json
  # R9 supersedes R8's report for approval purposes; R8's own
  # superseded_evidence_path (reports/02F_two_for_two_operational_
  # benchmark.json, the original R7 file) is untouched and remains
  # reachable from the R8 report itself -- this project does not maintain
  # a transitive chain field here, only the most recently superseded report.
  superseded_evidence_path: reports/02F_two_for_two_operational_benchmark_R8.json
  overwrite_policy: REFUSE_IF_EXISTS
  deadline_policy: PER_BUDGET_MONOTONIC_DEADLINE
  default_max_seconds_per_budget: null
  require_cli_deadline: true
  promotion_forbidden: true
  official_partition_artifact: false
  usable_for_training: false
  operational_approval_decision: false
  seed_search_forbidden: true
  note: >-
    require_cli_deadline=true and default_max_seconds_per_budget=null
    together mean there is NO implicit default deadline -- the researcher
    must always pass --benchmark-max-seconds-per-budget explicitly (a
    positive, finite number of seconds), and the CLI fails closed
    (BENCHMARK_ARGUMENT_INVALID) if it is missing, non-positive, NaN, or
    infinite. deadline_policy=PER_BUDGET_MONOTONIC_DEADLINE means the
    deadline is time.monotonic() + max_seconds_per_budget, freshly computed
    at the START of EACH of the four budgets (1pct/5pct/10pct/20pct) in
    small-to-large order -- never one deadline shared across the whole run,
    so an earlier budget can never consume a later budget's time budget.
    This flag cannot be combined with --preflight-only or
    --reconstruct-check. promotion_forbidden/official_partition_artifact=
    false/usable_for_training=false/operational_approval_decision=false
    are all recorded verbatim in the report itself, not just here, so the
    report can never be mistaken for an official artifact or an approval
    decision even in isolation from this config file.

# R11 -- the R10 two_for_two_hotpath_profiler config block has been REMOVED,
# together with the profiler mode itself (--profile-two-for-two-hotpath /
# --profile-max-seconds), its orchestration function, its report writer and
# its expected_invocation_identity cross-check. It existed solely to measure
# the two-for-two engine's Phase-1 hot loop; that neighborhood is no longer
# part of the active construction protocol, the profiler was never finished,
# and it never produced a report (reports/02F_two_for_two_hotpath_profile_
# R10.json was never written). No profiler report is needed and nothing in
# the active protocol replaces it.
#
# Note on a retired, never-verified figure: the removed block's
# expected_invocation_identity asserted
# one_for_one_move_count_before_two_for_two=3, which was INFERRED from the
# R9 report's aggregate one_for_one_move_count=3 -- a field that (before
# R11) merged exact-size add/remove toggles, exact-No-Finding swaps,
# coverage swaps and objective-repair swaps into one ambiguous number. That
# inference was never verified, because the profiler that would have checked
# it never ran. It is recorded here as retired-and-unverified rather than
# silently dropped. The R11 fix for that class of ambiguity is
# compute_repair_summary's move_count_by_phase / move_count_by_type (see
# required_evidence_fields below).

