gates_recorded_in_every_output:
  training_authorized: false
  training_started: false
  pseudo_labels_generated: false
  test_used: false

materialization:
  mode: stage_validate_readback_then_promote
  overwrite_policy: refuse_if_any_official_artifact_exists
  rollback_policy: remove_files_promoted_by_failed_run
  independent_readback_note: >-
    Independent readback must recompute every hard gate (exact L/U sizes,
    exact NF, 14/14 coverage, nested labeled AND nested NF, L-intersect-U is
    empty, L-union-U equals Train, val/test isolation, labeled annotation
    ownership, unlabeled annotations=[], no GT-derived fields present,
    category mapping, membership checksums) directly from the STAGED files
    on disk, not from in-memory Python objects still held from construction.
    The validation report status is PASS only if every hard gate is PASS.
  forbid_modifying:
    - data/processed/coco/instances_train.json
    - data/processed/coco/instances_val.json
    - data/processed/coco/instances_test.json
    - data/manifests/fixed_split_manifest.csv
    - data/manifests/split_lock_manifest.json
    - data/manifests/leakage_check_report.json
    - data/processed/coco/coco_master.json
    - data/processed/coco/coco_master_jpg.json

forbidden_actions:
  training: true
  inference: true
  pseudo_label_generation: true
  threshold_tuning: true
  ap_map_evaluation: true
  test_set_usage: true
  val_or_test_membership_modification: true
  seed_search: true
  protocol_self_modification: true
