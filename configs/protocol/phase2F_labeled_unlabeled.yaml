#     approved and actually runs.
# two_for_two_engine.operationally_approved remains false, unconditionally,
# and is not touched by this revision; --max-seconds is never grounds for
# self-approval.
#
# Revision: R4 (third GPT static review — REVISION REQUIRED, applied).
# Changes from R3 (fixes blockers R3-B1 and R3-B2):
#   - R3-B2 (independent readback did not compare exact labeled/unlabeled
#     image-record PAYLOAD, only annotation-level content): fixed.
#     independently_validate_staging now performs full semantic-payload
#     comparison of images, categories, and top-level fields against a
