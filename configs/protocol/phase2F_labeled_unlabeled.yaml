protocol:
  name: "Phase 2F — Labeled/Unlabeled Construction"
  phase_id: "2F"
  stage: "2F-C0-R11"
  # MAJOR bump: R11 removes the two-for-two neighborhood from the ACTIVE
  # final construction protocol. This is a scientific scope change, not a
  # refactor or an instrumentation round.
  version: "2.0.0"
  research_topic: >-
    Nghien cuu hoc ban giam sat cho do tim bat thuong tren X-quang phoi
    (Semi-Supervised Object Detection tren VinBigData Chest X-ray)

seed:
  partition_seed: 42
  seed_policy: PRE_SPECIFIED_LOCKED_NO_SEED_SEARCH
  seed_search_forbidden: true

dependencies:
  iterative_stratification:
    package_name: iterative-stratification
    import_name: iterstrat
    required_version: "0.1.9"
    version_check_method: importlib.metadata.version
    note: >-
      Runtime (run_preflight and compute_all_budgets, which backs both the
      official run and --reconstruct-check) MUST read the installed version
      via importlib.metadata ONLY -- never a __version__ attribute, never
      pkg_resources -- and FAIL CLOSED (DEPENDENCY_VERSION_MISMATCH /
      NOT_INSTALLED) if it differs from required_version at all, including
      a patch-level difference. The resolved version string is recorded
      verbatim in the validation report and in phase2F_seed_manifest.json.

