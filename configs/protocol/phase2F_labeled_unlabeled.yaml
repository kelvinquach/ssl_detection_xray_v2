# Phase 2F — Labeled/Unlabeled Construction — LOCKED PROTOCOL
#
# =========================== ACTIVE PROTOCOL (R11) ========================== #
#
# Revision: R11 (protocol simplification -- a real scientific scope change,
# hence the MAJOR version bump to 2.0.0). The ACTIVE construction protocol is
# now, in this exact order:
#
#   iterative multilabel stratification
#   -> exact-size repair
#   -> exact-No-Finding repair
#   -> minimum-class-coverage ONE-FOR-ONE repair
#   -> deterministic ONE-FOR-ONE objective repair
#   -> stop at a ONE-FOR-ONE LOCAL OPTIMUM
#   -> validation
#   -> transactional promotion
#
# ACTIVE CLAIMS (the complete list -- nothing beyond these is claimed):
#   - the ACTIVE objective neighborhood is the EXHAUSTIVE one-for-one swap
#     neighborhood: every admissible (selected, addable-pool) pair of equal
#     zero_gt status is enumerated on every iteration, with no top-k, no
#     sampling, no early cut-off and no heuristic pruning;
#   - termination is a ONE-FOR-ONE LOCAL OPTIMUM, and reaching it is a
#     SUCCESSFUL result (RepairOutcome.OK) -- never COMPUTATIONAL_ABORT,
#     never REPAIR_INFEASIBLE;
#   - NO GLOBAL OPTIMUM IS CLAIMED, at any budget, under any circumstances.
#
# WHY THE TWO-FOR-TWO NEIGHBORHOOD WAS REMOVED FROM THE ACTIVE PROTOCOL:
# computational tractability and proportionality, nothing else. A real,
# non-promoting R9 operational-benchmark run (partition_seed=42, budget 1pct)
# reached only 24,849,751 of 102,347,037 Phase-1 signature transitions
# (R=303, A=337,779) in 591.922 s and ended in COMPUTATIONAL_ABORT with
# two_for_two_move_count=0. A static audit of that run established that at
# the moment the engine was first invoked, EVERY hard constraint was already
# satisfied -- exact labeled size 34, exact No-Finding size 3, subset
# entirely inside Phase 2E TRAIN, selected/unlabeled complement semantics,
# no VAL/TEST data used for construction, all 14 abnormality classes
# present, seed=42, no seed search -- and that the invocation occurred in
# `objective_repair` only AFTER the one-for-one neighborhood had already
# been exhausted. It was therefore OPTIONAL objective refinement, never
# required hard-constraint repair. Spending that compute to search for one
# further optional improvement on a 34-image subset is disproportionate.
#
# DECISION HYGIENE (recorded so it can be published verbatim): the decision
# was made BEFORE any training, BEFORE any pseudo-labelling, WITHOUT model
# metrics, WITHOUT VAL/TEST outcome selection, WITHOUT comparing candidate
# partitions, and WITHOUT any seed search. partition_seed remains 42 and
# seed_search_forbidden remains true, unconditionally.
#
# EVIDENCE PRESERVATION: reports/02F_two_for_two_operational_benchmark.json
# (R7), ..._R8.json and ..._R9.json remain HISTORICAL EVIDENCE of their own
# runs. R11 does not delete, overwrite, re-interpret or invalidate any of
# them; it only stops treating the neighborhood they measured as part of the
# active protocol.
#
# WHAT R11 REMOVED FROM ACTIVE STATUS (see legacy_two_for_two_engine below,
# which is retained ONLY as a historical record and for the retained legacy
# unit tests):
#   - "exhaustive two-for-two search";
#   - "two-for-two local optimum";
#   - "mathematical completeness over the two-for-two neighborhood";
#   - "operational tractability approval for two-for-two" (the
#     operationally_approved gate no longer gates anything: active
#     construction does not depend on it, and it was NOT flipped to true --
#     compute_all_budgets now enforces repair.active_repair_policy instead);
#   - the entire R10 hot-path-profiler mode, its CLI flags
#     (--profile-two-for-two-hotpath / --profile-max-seconds) and its config
#     block. It was never finished and never produced a report.
#
# LOCKED DECISIONS UNCHANGED BY R11: partition_seed=42;
# PRE_SPECIFIED_LOCKED_NO_SEED_SEARCH; budgets 1/5/10/20%; nested
# small-to-large subsets; exact labeled-size targets; exact No-Finding
# targets; TRAIN-only construction; fixed VAL/TEST; minimum coverage of all
# 14 classes; exact integer lexicographic objective; strictly-improving
# moves only; deterministic namespaced SHA-256 tie-break; canonical numeric
# fallback; transactional staging/readback/promotion/rollback;
# training_authorized=false; no training; no pseudo-labelling; no test use.
#
# ===================== HISTORICAL REVISION NOTES (R2-R10) ================== #
# Everything below this line is a historical record of past static-review
# cycles. It is NOT a description of the active protocol. Where a historical
# note asserts a two-for-two claim, that claim is superseded by the ACTIVE
# PROTOCOL section above.
#
# Revision: R10 (measurement instrumentation only -- NOT a scientific
# algorithm change, NOT an optimization). Motivated by a real R9 benchmark
# run that still ended in COMPUTATIONAL_ABORT at budget 1pct after 600s
# (R=303, A=337,779, phase1_transition_count=102,347,037,
# phase1_transitions_evaluated=24,849,751, elapsed_seconds=591.922,
# observed_throughput~=41,981 transitions/second, progress~=24.28%). R9
# processed more transitions than R8 in these two single benchmark runs;
# this is not treated as a stable causal speedup estimate. A linear R9
# extrapolation suggests ~40.6 minutes for one full Phase-1 pass (estimate,
# not a measured completion time, and excludes Phase 2/resumption).
# Adds a NEW, mutually-exclusive CLI mode (--profile-two-for-two-hotpath,
# requiring --profile-max-seconds) that reproduces the real locked
# reference invocation (budget=1pct, repair_phase=objective_repair,
# locked=empty since 1pct has no nested parent) via build_budget_step (the
# SAME production primitive the official run and the R7 benchmark both
# use -- never re-implemented), then measures it via:
#   - Layer A: coarse (bounded-phase, never per-transition) wall-clock
#     timers around preflight, indicator construction, stratification,
#     each repair phase, equivalence-class/removed-pair/added-pair
#     construction, R9 aggregate precomputation, and the real engine
#     invocation's own diagnostics (phase1_transitions_evaluated,
#     throughput, percent-of-theoretical-complete, watchdog ticks,
#     deadline status);
#   - Layer B: ONE bounded, deterministic-PREFIX (never random/seed-
#     searched) microbenchmark, reusing the real precomputed aggregate
#     matrices and the real accept_and_rank closure as ground truth, run
#     ONCE immediately after the R9 precompute and BEFORE the real Phase-1
#     search begins (so it never competes with or depends on the real
#     search's remaining deadline budget). Component isolation via
#     separate cumulative passes over the same fixed prefix, never nested
#     per-operation timers inside one combined loop. Every hand-computed
#     component is cross-checked against the real accept_and_rank closure's
#     own decisions; any disagreement is a hard fail
#     (PROFILE_SEMANTIC_EQUIVALENCE_FAILURE), never silently ignored.
# Implementation: two new, purely-additive, default-None keyword
# parameters (`phase_timing`, `hotpath_profile`) threaded through
# build_budget_step -> repair_objective_local_search ->
# _equivalence_class_two_for_two_search. Every existing caller (the
# official run, --reconstruct-check, --benchmark-two-for-two, and every
# pre-R10 test) never passes these parameters, so their behavior, return
# values, and diagnostics dict contents are BYTE-IDENTICAL to R9 -- see
# TestR9AddedPairPrecompute and every other pre-R10 guardrail class, which
# remain unmodified and passing. A fail-closed PROFILE_INVOCATION_IDENTITY_
# MISMATCH check (inside the engine, for R/A/signature-count fields, and in
# run_two_for_two_hotpath_profile itself, for the "engine never invoked"
# case) runs BEFORE the Layer-B microbenchmark, comparing the real,
# freshly-recomputed invocation against
# two_for_two_hotpath_profiler.expected_invocation_identity below (the
# locked R9 evidence numbers) -- a real-data invocation that has drifted
# from that evidence is never silently profiled as if it matched.
# CLAIM DISCIPLINE (explicit): this revision does NOT claim this round's
# measurements will match the R9 evidence exactly outside the exact
# machine/run conditions recorded in the report, does NOT claim the
# deterministic-prefix microbenchmark is representative of the complete
# R*A space, does NOT claim any suspected hotspot is proven before
# measurement, does NOT claim memoization/vectorization/a Python-integer
# representation will solve tractability, and does NOT claim profiler
# completion implies engine approval -- operationally_approved and
# training_authorized remain false, untouched by this revision.
# two_for_two_engine.same_composition_algorithm (R9's precompute-hoisted
# implementation) remains the active production engine being profiled;
# this revision adds instrumentation only.
#
# Revision: R9 (static-audit-driven performance fix, implementing exactly
# ONE optimization identified by the R8 static performance audit -- the
# audit itself performed no execution and made no speedup claims).
# Evidence that motivated this round: a real R8 benchmark run at budget
# 1pct (COMPUTATIONAL_ABORT after 600s; R=303, A=337,779,
# phase1_transition_count=102,347,037) plus a static source trace
# confirming _stream_best_prefix_above reconstructed the ADDED-pair vector
# via _signature_vector on every single (removed_pair, added_pair)
# combination, even though that vector depends ONLY on the added pair,
# never on the removed pair -- structurally certain redundant work.
# Fixed by:
#   - precomputing each ADDED signature pair's aggregate vector and sum
#     EXACTLY ONCE per engine call (before the R x A loop), read via index
#     lookup inside the loop instead of reconstructed on every (removed,
#     added) combination; and hoisting the REMOVED pair's vector-sum out
#     of the inner A loop (computed once per removed pair, not once per
#     transition) -- both are pure loop-invariant-code-motion refactors,
#     mathematically and bit-for-bit identical to the pre-R9 computation;
#   - a contiguous (A, 14) int64 ndarray for the added-pair aggregates
#     (never a Python list/dict of hundreds of thousands of individual
#     ndarray objects), built from a small per-DISTINCT-signature base-
#     vector table (p rows, p = pool_distinct_signature_count, not A);
#   - the SAME bounded periodic deadline check (_tick_watchdog, same
#     TWO_FOR_TWO_DEADLINE_WATCHDOG_INTERVAL, unchanged) now also covers
#     the precompute loop itself, WITHOUT incrementing
#     phase1_transitions_evaluated -- a deadline expiry during precompute
#     is classified as an abort with phase1_transitions_evaluated=0
#     (correctly: no logical R x A transition was ever evaluated yet),
#     never a false COMPLETED/EXHAUSTED claim;
#   - traversal order (removed_pairs outer, added_pairs inner), hard-
#     constraint/objective/tie-break/acceptance semantics, Phase-2
#     enumeration, and every other scientific decision are completely
#     UNCHANGED -- proven via a dedicated TEST-ONLY reproduction of the
#     exact pre-R9 (R8) algorithm compared bit-for-bit against the
#     optimized production engine, including a full-sequence traversal-
#     order comparison, not just final-output equality;
#   - operationally_approved=false, training_authorized=false,
#     partition_seed=42, budgets, nested policy, and every locked
#     scientific decision are unchanged;
#   - the R7 and R8 operational benchmark reports are PRESERVED unchanged;
#     this round writes a NEW, distinct report path
#     (reports/02F_two_for_two_operational_benchmark_R9.json) and records
#     R8's report as the evidence it supersedes for approval purposes
#     (NOT as invalid -- R8 remains valid historical evidence of its own
#     run, exactly like R7 before it).
# CLAIM DISCIPLINE (explicit, per this round's own instructions): this
# revision does NOT claim the optimization makes the real 1pct benchmark
# complete, and does NOT predict a speedup percentage from static
# reasoning. What is claimed: (1) the structurally-certain redundant
# _signature_vector reconstruction identified by the R8 audit has been
# removed per the source; (2) scientific search semantics are unchanged
# IF AND ONLY IF the regression/oracle-equivalence tests in
# TestR9AddedPairPrecompute pass; (3) any actual operational speedup must
# be measured empirically by a fresh R9 benchmark run, not asserted here.
# See tests/test_phase2F_labeled_unlabeled_guardrails.py's
# TestR9AddedPairPrecompute.
#
# Revision: R8 (production scientific-neighborhood-semantics fix,
# discovered via a real R7 benchmark run). At BOTH production call sites
# (repair_min_class_coverage, repair_objective_local_search),
# _equivalence_class_two_for_two_search's `pool` argument was the RAW
# new_region_pool (still containing `selected`) instead of the correct
# addable-only complement new_region_pool - selected -- the one-for-one
# branch in both functions already computed this correctly, proving the
# defect was isolated to the two-for-two call sites only. This let an
# image be simultaneously a removable (selected) and addable (pool)
# candidate for the same move, which must never happen (locked semantics:
# selected ∩ addable_pool = ∅). Evidence: a real 1pct-budget benchmark run
# reported selected_abnormal_count=31 and pool_abnormal_count=3076 (~the
# entire train abnormal population, not just the addable complement),
# proving the addable pool was contaminated with images that were
# simultaneously on the removed side, and that the concrete addable
# candidate universe was wrong. The run reached COMPUTATIONAL_ABORT after
# 600 seconds with a reported phase1_transition_count of 103,846,887 --
# but Phase 1 counts DISTINCT SIGNATURE PAIRS, not raw pool size, so the
# actual effect of this contamination on R (removed-pair signature count),
# A (added-pair signature count), and phase1_transition_count is NOT
# inferred from the R7 report; it must be measured empirically by a fresh
# R8 benchmark run against the corrected neighborhood.
# Fixed by:
#   - passing new_region_pool - selected (not new_region_pool) to the
#     engine at both production call sites, matching the one-for-one
#     branches' existing pattern exactly;
#   - adding fail-closed defense-in-depth INSIDE
#     _equivalence_class_two_for_two_search: selected/pool overlap, and
#     locked/selected or locked/pool overlap, now raise
#     Phase2FError(..., "PROTOCOL_VIOLATION") immediately, before any
#     search work begins -- never silently auto-subtracted/canonicalized,
#     so a future caller regression is surfaced loudly instead of masked;
#   - pool_abnormal_count and all other pool-derived diagnostics are
#     automatically correct once the `pool` argument itself is correct (no
#     separate diagnostics-only fix was needed or made);
#   - the R7 operational benchmark report
#     (reports/02F_two_for_two_operational_benchmark.json) is PRESERVED
#     unchanged -- it remains valid historical evidence of the R7 run, but
#     is no longer eligible for the operational-approval decision because
#     it ran against the overlap-defective neighborhood implementation.
#     Any future benchmark re-run must write to a distinct, versioned
#     report path (see operational_benchmark.report_path and
#     operational_benchmark.superseded_evidence_path below) and must never
#     overwrite the R7 file;
#   - no algorithm change beyond restoring the correct, always-intended
#     locked neighborhood semantics -- budgets, NF/nested targets,
#     objective/tie-break rules, operationally_approved, training_
#     authorized, and partition_seed are all unchanged by this revision.
# See tests/test_phase2F_labeled_unlabeled_guardrails.py's
# TestTwoForTwoDisjointNeighborhoodInvariant.
#
# Revision: R7 (operational benchmark mode). Adds a NON-PROMOTING
# operational benchmark of the two-for-two repair engine
# (--benchmark-two-for-two) so the researcher can measure empirical
# operational tractability on the REAL 3,426-image instances_train.json
# before deciding two_for_two_engine.operationally_approved. This is NOT
# full materialization and NOT a partition-creation step:
#   - it reuses the exact production per-budget construction primitive
#     (build_budget_step) so the membership/repair/objective algorithm is
#     never copied or re-implemented;
#   - it is the ONLY call path allowed to reach build_budget_step while
#     two_for_two_engine.operationally_approved=false -- compute_all_
#     budgets's unconditional approval gate (shared by the official run
#     AND --reconstruct-check) is completely unchanged;
#   - each budget gets its OWN fresh wall-clock deadline
#     (time.monotonic() + benchmark_max_seconds_per_budget), reset at the
#     start of every budget -- never one global deadline that lets an
#     early budget consume a later budget's time;
#   - it never writes official labeled/unlabeled COCO, never writes the
#     official lock manifest, never calls write_all_outputs_and_promote or
#     promote_with_rollback -- the ONLY file it may write is
#     reports/02F_two_for_two_operational_benchmark.json (see
#     operational_benchmark block below), and it refuses to overwrite that
#     report if it already exists;
#   - completing a benchmark run (even overall_status=COMPLETED) is
#     explicitly NOT an operational-approval decision
#     (operational_approval_decision=false is always recorded in the
#     report) and is never printed as PHASE_2F_GATE=PASS.
# See operational_benchmark: below for the full config contract.
#
# Revision: R6 (fifth GPT static review — REVISION REQUIRED, applied).
# Fixes four blockers left open by R5 (R5-B1..R5-B4):
#   - R5-B1 (image_ids_within_universe was computed but excluded from
#     _STRUCTURAL_CRASH_RISK_CHECK_NAMES, so a staged out-of-universe id
#     could leave struct["ok"]=True and later crash the nested No-Finding
#     computation with KeyError on locked_image_id_to_position): fixed --
#     image_ids_within_universe is now a crash-risk prerequisite, AND the
#     nested No-Finding loop itself now does a separate, defense-in-depth,
#     fail-closed membership check before any dict lookup keyed by a staged
#     id, never silently dropping an invalid id and computing over the rest;
#   - R5-B2 (a diagnostics record was only appended to the log AFTER the
#     engine returned normally, so a DeadlineExceeded-raising invocation --
#     precisely the highest-resource-risk one -- left no evidence at all):
#     fixed -- callers now append a "started" placeholder record to the log
#     BEFORE invoking the engine, and the engine mutates that exact object
#     in place (including finalizing it to status="aborted" with every
#     counter known at that moment, nullable-not-zero for the rest) right
#     before re-raising DeadlineExceeded unchanged;
#   - R5-B3 (the deadline watchdog only polled every 1024 candidates
#     inside the search loops, so an invocation with fewer candidates than
#     that, or one that expired in the gap after the last candidate but
#     before returning, could complete undetected past the deadline): fixed
#     -- _check_deadline is now ALSO called once at function entry and once
#     immediately before every normal return path (trivial early-exit,
#     exhausted, completed), as boundary checks layered on top of the
#     existing in-loop watchdog, never a candidate cap;
#   - R5-B4 (the "timeout does not promote" test only checked that
#     compute_all_budgets's per-budget loop stopped, never that
#     write_all_outputs_and_promote was actually never called): fixed with
#     an orchestration-level test that patches write_all_outputs_and_promote
#     and asserts it is never invoked when construction reports
#     COMPUTATIONAL_ABORT.
#
# Revision: R5 (fourth GPT static review — REVISION REQUIRED, applied).
# Fixes five blockers left open by R4 (R4-B1..R4-B5):
#   - R4-B1 (independently_validate_staging() called build_indicators() on
#     STAGED, possibly-corrupted data before any structural validation, so a
#     corrupted staged file could crash readback with Phase2FError instead
